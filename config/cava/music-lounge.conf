# Music lounge — SDL, на всю ширину окна
# sdl_width / sdl_height подставляет music-lounge.sh под монитор

[general]
framerate = 60
bars = 0
bar_width = 14
bar_spacing = 4
autosens = 1
sensitivity = 120
lower_cutoff_freq = 40
higher_cutoff_freq = 16000

[input]
method = pipewire
source = auto

[output]
method = sdl
orientation = bottom
channels = mono
mono_option = average
sdl_width = 1920
sdl_height = 140
sdl_x = 0
sdl_y = 0

[color]
background = '#0a100e'
gradient = 1
gradient_color_1 = '#2f5c3e'
gradient_color_2 = '#3d7a52'
gradient_color_3 = '#2a8a7a'
gradient_color_4 = '#2f8fb8'
gradient_color_5 = '#4aaee0'
gradient_color_6 = '#7ec8f2'

[smoothing]
monstercat = 1
waves = 1
noise_reduction = 65
