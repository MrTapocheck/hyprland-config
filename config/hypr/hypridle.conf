# https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
general {
    lock_cmd = pidof hyprlock || ~/.config/hypr/hyprlock.sh
    unlock_cmd = pkill -USR1 hyprlock
    inhibit_sleep = 3
    before_sleep_cmd = ~/.config/hypr/before-sleep.sh
    after_sleep_cmd = ~/.config/hypr/after-sleep.sh
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false
}

# Блокировка через 10 мин
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Экран off через 10:30
listener {
    timeout = 630
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Через 20 мин — lock + экран off (без suspend; крышка = logind suspend)
listener {
    timeout = 1200
    on-timeout = ~/.config/hypr/idle-screen-off.sh
}
