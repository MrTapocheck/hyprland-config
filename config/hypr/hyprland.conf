# =========================

# Мониторы

# =========================

monitor = HDMI-A-1,1920x1080@60,0x0,1
monitor = eDP-1,1920x1080@60,1920x0,1

cursor {
    default_monitor = HDMI-A-1
}

env = XCURSOR_THEME,Nordic-cursors
env = XCURSOR_SIZE,24

# workspace 1 — на внешнем мониторе (при одном мониторе правило просто игнорируется)
workspace = 1, monitor:HDMI-A-1, default:true


# =========================

# Автозапуск

# =========================
exec-once = ~/.config/hypr/network-start.sh
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --all
exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh #для секретного хранилища
exec-once = mako
exec-once = ~/.config/hypr/swayosd-server.sh
exec-once = ~/.config/hypr/audio-setup.sh
exec-once = ~/.config/hypr/music-lounge.sh ensure-daemon
exec = ~/.config/hypr/music-lounge.sh ensure-daemon
exec-once = hyprctl setcursor Nordic-cursors 24
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'Nordic-cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = bash -c 'command -v hypridle >/dev/null && hypridle'

# обои: awww с fade, иначе hyprpaper
exec-once = bash -c 'if command -v awww-daemon >/dev/null; then awww-daemon; else hyprpaper; fi'
exec-once = sleep 0.3 && ~/.config/hypr/workspace-wallpapers.sh
exec-once = hyprctl dispatch moveworkspacetomonitor 1 HDMI-A-1
exec-once = hyprctl dispatch workspace 1

# waybar (скрыт по умолчанию, двойной Super — показать/скрыть)
exec-once = waybar

# приложения на рабочих столах 1–4
exec-once = ~/.config/hypr/autostart-apps.sh

# =========================

# Переменные

# =========================
$mainMod = SUPER

# =========================
# Глобальные настройки (ДОБАВИТЬ ЭТО)
# =========================
resolve_binds_by_sym = 1
# =========================
# Ввод
# =========================
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
    kb_rules =
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap_button_map = lrm
        tap-and-drag = true
        clickfinger_behavior = true
        disable_while_typing = false
    }
}

# =========================
# Внешний вид (тёмная тема)
# =========================
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    no_focus_fallback = false

    # Правильные названия
    col.active_border = rgba(89b4f0ee)
    col.inactive_border = rgba(313244aa)

    # Для группировки окон (если используешь)
    # col.group_border = rgba(313244aa)
    # col.group_border_active = rgba(89b4f0ee)
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.88
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 2
        new_optimizations = true
    }

    # Тени теперь в отдельной подсекции
    shadow {
        enabled = true
        range = 12          # раньше было shadow_range
        render_power = 3    # раньше было shadow_render_power
        color = rgba(1a1a1aee)
        # offset = 0,0      # можно сдвинуть тень, если нужно
    }

    # Можно добавить
    # active_opacity = 1.0
    # inactive_opacity = 0.95
}

# =========================

# Анимации

# =========================

animations {
    enabled = yes
    workspace_wraparound = true

    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshoot, 0.34, 1.56, 0.64, 1
    bezier = wind, 0.05, 0.9, 0.1, 1.1
    bezier = menuEase, 0.16, 1, 0.3, 1
    bezier = funky, 0.42, 0, 0.58, 1
    bezier = jelly, 0.68, -0.55, 0.27, 1.55
    bezier = dramatic, 0.22, 1, 0.36, 1

    animation = global, 1, 12, wind
    animation = border, 1, 10, easeOutQuint
    animation = borderangle, 1, 300, linear, loop

    animation = windows, 1, 9, wind, gnomed
    animation = windowsIn, 1, 8, overshoot, popin 60%
    animation = windowsOut, 1, 6, easeInOutCubic, popin 60%
    animation = windowsMove, 1, 7, jelly, slide

    animation = layers, 1, 6, menuEase, slide
    animation = layersIn, 1, 6, dramatic, slide top
    animation = layersOut, 1, 5, easeInOutCubic, slide top

    animation = fade, 1, 10, quick
    animation = fadeIn, 1, 3, almostLinear
    animation = fadeOut, 1, 3, almostLinear
    animation = fadeSwitch, 1, 10, wind
    animation = fadeShadow, 1, 12, easeOutQuint
    animation = fadeDim, 1, 10, funky
    animation = fadeLayers, 1, 8, quick
    animation = fadeLayersIn, 1, 3, almostLinear
    animation = fadeLayersOut, 1, 3, almostLinear
    animation = fadePopups, 1, 7, quick
    animation = fadePopupsIn, 1, 3, almostLinear
    animation = fadePopupsOut, 1, 3, almostLinear
    animation = fadeDpms, 1, 12, easeOutQuint

    animation = workspaces, 0, default, default
    animation = workspacesIn, 0, default, default
    animation = workspacesOut, 0, default, default
    animation = specialWorkspace, 1, 8, menuEase, slidefadevert 25%
    animation = specialWorkspaceIn, 1, 8, overshoot, slidefadevert 25%
    animation = specialWorkspaceOut, 1, 8, easeInOutCubic, slidefadevert 25%

    animation = zoomFactor, 1, 10, quick
    animation = monitorAdded, 1, 12, easeOutQuint
}

# =========================

# Горячие клавиши

# =========================
bindel = , XF86AudioRaiseVolume, exec, ~/.config/hypr/volume-osd.sh up
bindel = , XF86AudioLowerVolume, exec, ~/.config/hypr/volume-osd.sh down
bindl  = , XF86AudioMute, exec, ~/.config/hypr/volume-osd.sh mute

bindel = , XF86MonBrightnessUp, exec, ~/.config/hypr/brightness-osd.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/brightness-osd.sh down

bind = ALT, F9, exec, ~/.config/hypr/obs-record-toggle.sh
bind = , XF86Sleep, exec, ~/.config/hypr/suspend.sh
bind = $mainMod SHIFT, Z, exec, ~/.config/hypr/suspend.sh

#для буфера обмена
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
bind = $mainMod, V, exec, ~/.config/hypr/clipboard-panel.sh

bind = CONTROL ALT, T, exec, konsole
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/wallpaper-peek.sh
bind = $mainMod, E, exec, thunar
bind = $mainMod, L, exec, ~/.config/hypr/hyprlock.sh #экран блокировки

# waybar — двойное нажатие Super (400 мс)
bindl = , Super_L, exec, ~/.config/hypr/waybar-toggle.sh
bindl = , Super_R, exec, ~/.config/hypr/waybar-toggle.sh

# =========================
# Перемещение фокуса (стрелки)
# =========================
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# =========================
# Поменять окна местами (Swap)
# =========================
bind = $mainMod SHIFT, left,  swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up,    swapwindow, u
bind = $mainMod SHIFT, down,  swapwindow, d

# =========================
# Рабочие столы (1-9)
# =========================
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, exec, ~/.config/hypr/music-lounge-goto.sh
bind = $mainMod, 0, workspace, 10
bind = $mainMod, 9, workspace, 9

# Перемещение окон на workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# =========================
# фулскрин текущего окна
# =========================
bind = $mainMod, F, fullscreen
# =========================
# Перенести текущий workspace на соседний монитор
# =========================
bind = $mainMod CTRL SHIFT, left,  movecurrentworkspacetomonitor, l
bind = $mainMod CTRL SHIFT, right, movecurrentworkspacetomonitor, r

# =========================
# Переместить окно на workspace (без переключения)
# =========================
bind = $mainMod CTRL SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL SHIFT, 0, movetoworkspacesilent, 10
bind = $mainMod CTRL SHIFT, 9, movetoworkspacesilent, 9

# =========================
# Скриншоты
# =========================
bind = $mainMod SHIFT, S, exec, grim -g "$(slurp)" - | tee ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy -t image/png
bind = $mainMod SHIFT, P, exec, grim - | tee ~/Pictures/$(date +%Y-%m-%d_%H-%M-%S).png | wl-copy -t image/png

# Дополнительно
bind = $mainMod SHIFT, C, exec, grim -g "$(slurp)" - | wl-copy -t image/png

# =========================

# Управление окнами мышью

# =========================

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# =========================
# Правила окон
# =========================
windowrule {
    name = chromium_ws1
    match:class = ^(chromium)$
    workspace = 1
}

windowrule {
    name = yakuake_ws2
    match:class = ^(org.kde.yakuake)$
    workspace = 2
}

windowrule {
    name = telegram_ws3
    match:class = ^(TelegramDesktop)$
    workspace = 3
}

windowrule {
    name = webcord_ws3
    match:class = ^(WebCord)$
    workspace = 3
}

windowrule {
    name = thunar_ws4
    match:class = ^(Thunar)$
    workspace = 4
}

# imv — открывается на 9 workspace, полноэкранно
windowrule {
    name = imv_photo_viewer
    match:class = ^(imv)$
    workspace = 9
    fullscreen = true
}

# Music lounge — workspace 8 (Super+8)

windowrule {
    name = music_bg
    match:class = ^(mpv-music-bg)$
    workspace = 8
    no_focus = true
    border_size = 0
    rounding = 0
    opacity = 1.0
}

windowrule {
    name = music_viz
    match:class = ^(cava)$
    workspace = 8
    float = true
    no_focus = true
    border_size = 0
    rounding = 12
    opacity = 0.96
}

windowrule {
    name = music_widget_l
    match:class = ^(mpv-music-widget-l)$
    workspace = 8
    float = true
    no_focus = true
    border_size = 0
    opacity = 0.88
    rounding = 16
}

windowrule {
    name = music_widget_r
    match:class = ^(mpv-music-widget-r)$
    workspace = 8
    float = true
    no_focus = true
    border_size = 0
    opacity = 0.88
    rounding = 16
}

# Контекстное меню фото в imv (клавиша Menu — не перехватывает ПКМ в других приложениях)
bind = , code:107, exec, ~/.config/hypr/imv-menu.sh, class:^(imv)$
