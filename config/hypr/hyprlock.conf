# =========================
# Ввод
# =========================
input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,grp:win_space_toggle
    kb_rules =
    resolve_binds_by_sym = 1
}
general {
    disable_loading_bar = true
    grace = 5
    hide_cursor = true
    no_fade_in = false
    ignore_empty_input = true
}

# =========================
# Фон
# =========================
background {
    monitor =
    path = $HOME/Pictures/wallpapers/wall1.jpeg
    blur_passes = 3
    blur_size = 8
    contrast = 0.9
    brightness = 0.6
}

# =========================
# Часы (большие)
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "<span font='48'>$TIME</span>"
    color = rgba(cdd6f4ee)
    font_size = 60
    font_family = JetBrains Mono
    position = 0, 150
    halign = center
    valign = center
}

# =========================
# Дата
# =========================
label {
    monitor =
    text = cmd[update:1000] echo "<span font='20'>$(date +'%A, %d %B')</span>"
    color = rgba(bac2deee)
    font_size = 20
    font_family = JetBrains Mono
    position = 0, 80
    halign = center
    valign = center
}

# =========================
# Приветствие
# =========================
label {
    monitor =
    text = Hi there, $USER
    color = rgba(cdd6f4ee)
    font_size = 18
    font_family = JetBrains Mono
    position = 0, -80
    halign = center
    valign = center
}

# =========================
# Поле ввода пароля
# =========================
input-field {
    monitor =
    size = 350, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgb(89b4fa)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -150
    halign = center
    valign = center
}

# =========================
# Подсказка снизу
# =========================
label {
    monitor =
    text = <i>Press Enter to unlock</i>
    color = rgba(a6adc8aa)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, -220
    halign = center
    valign = center
}

label {
    monitor =
    text = $LAYOUT[us,ru]
    color = rgba(89b4faee)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -280
    halign = center
    valign = center
    onclick = hyprctl switchxkblayout current next
}
